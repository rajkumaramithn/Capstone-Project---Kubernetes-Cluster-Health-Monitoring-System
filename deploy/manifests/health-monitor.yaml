apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-monitor
  namespace: default
  labels:
    app: health-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-monitor
  template:
    metadata:
      labels:
        app: health-monitor
    spec:
      serviceAccountName: health-monitor-sa
      containers:
        - name: health-monitor
          image: health-monitor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: health-monitor
  namespace: default
spec:
  selector:
    app: health-monitor
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
  type: ClusterIP
