apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-balanced-demo
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: resource-balanced-demo
  template:
    metadata:
      labels:
        app: resource-balanced-demo
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi