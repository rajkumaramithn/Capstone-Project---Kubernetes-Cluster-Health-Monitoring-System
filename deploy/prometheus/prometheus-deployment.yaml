apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: kubernetes-health-monitor
        metrics_path: /metrics
        static_configs:
          - targets: ["health-monitor:8080"]
  alerts.yml: |
    groups:
      - name: kubernetes-health-monitor
        rules:
          - alert: UnhealthyPodsDetected
            expr: kubernetes_health_monitor_unhealthy_pods > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: Unhealthy Kubernetes pods detected
              description: "The health monitor reports {{ $value }} unhealthy pod(s)."
          - alert: KubernetesNodeNotReady
            expr: kubernetes_health_monitor_nodes{status!="Ready"} > 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Kubernetes node is not ready
              description: "Node {{ $labels.node }} has readiness status {{ $labels.status }}."
          - alert: KubernetesNodeResourcePressure
            expr: kubernetes_health_monitor_node_pressure == 1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: Kubernetes node resource pressure detected
              description: "Node {{ $labels.node }} reports {{ $labels.condition }}."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.8.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: web
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: default
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
  type: ClusterIP
