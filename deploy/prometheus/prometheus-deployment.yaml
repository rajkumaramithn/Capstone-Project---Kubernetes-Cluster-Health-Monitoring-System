apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: kubernetes-health-monitor
        metrics_path: /metrics
        static_configs:
          - targets: ["health-monitor:8080"]

  alerts.yml: |
    groups:
      - name: kubernetes-health-monitor
        rules:
          - alert: HealthMonitorDown
            expr: up{job="kubernetes-health-monitor"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: Health monitor is down
              description: "The health monitor target has been unreachable for 1 minute."

          - alert: UnhealthyPodsDetected
            expr: kubernetes_health_monitor_unhealthy_pods > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: Unhealthy Kubernetes pods detected
              description: "The health monitor reports {{ $value }} unhealthy pod(s)."

          - alert: KubernetesNodeNotReady
            expr: kubernetes_health_monitor_nodes{status!="Ready"} > 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Kubernetes node is not ready
              description: "Node {{ $labels.node }} has readiness status {{ $labels.status }}."

          - alert: KubernetesNodeResourcePressure
            expr: kubernetes_health_monitor_node_pressure == 1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: Kubernetes node resource pressure detected
              description: "Node {{ $labels.node }} reports {{ $labels.condition }}."

          - alert: HighNodeCPU
            expr: kubernetes_health_monitor_node_cpu_usage_percent > 85
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: High node CPU usage
              description: "Node {{ $labels.node }} CPU usage is {{ $value }}%."

          - alert: HighNodeMemory
            expr: kubernetes_health_monitor_node_memory_usage_percent > 85
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: High node memory usage
              description: "Node {{ $labels.node }} memory usage is {{ $value }}%."

          - alert: PodExcessiveRestarts
            expr: kubernetes_health_monitor_pods_with_excessive_restarts > 0
            for: 5m
            labels:
              severity: info
            annotations:
              summary: Pod has restarted many times
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted more than 3 times."

          - alert: NodeScalingRecommended
            expr: kubernetes_health_monitor_node_scaling_recommendation == 1
            for: 1m
            labels:
              severity: info
            annotations:
              summary: Node scaling recommended
              description: "Node {{ $labels.node }} {{ $labels.resource }} utilization is high enough that adding a node is recommended."

          - alert: HealingActionTaken
            expr: increase(kubernetes_health_monitor_healing_actions_total[5m]) > 0
            labels:
              severity: info
            annotations:
              summary: Auto-healing action performed
              description: "The healer removed a {{ $labels.reason }} pod in namespace {{ $labels.namespace }}."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.8.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - name: web
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: default
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
  type: ClusterIP